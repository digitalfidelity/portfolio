<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #12264a; }

        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 33, 96, 0.08); }
        .item { padding: 12px 0; border-bottom: 1px solid #e7edf9; }

        a { color: #1f4db8; text-decoration: none; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Quick Menu</h1>
        <div class="item"><strong>Glossary</strong> - Definitions for yield, duration, and call features.</div>
        <div class="item"><strong>Download CSV</strong> - Export current table positions.</div>
        <div class="item"><strong>Sign Out</strong> - End your dashboard session securely.</div>
        <p><a href="../index.html">Back to dashboard</a></p>
    </div>
</div>

</html>
